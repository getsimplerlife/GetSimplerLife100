<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Simpler Life" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="dns-prefetch" href="https://js.stripe.com" />
  <link rel="preconnect" href="https://js.stripe.com" />
  <title>Simpler Life 100 | AI Operations Teams</title>
  <meta name="description" content="Replace hours of manual work with AI coworkers that integrate into your existing tools. Real results, no complexity." />
</head>
<body>
  <div id="root"></div>
  <script>
    window.__errors = [];
    window.__logs = [];
    function showError(msg) {
      window.__errors.push(msg);
      var el = document.getElementById('root');
      if(el) el.innerHTML = '<pre style="color:red;padding:20px;font-size:14px;background:#111;white-space:pre-wrap">'+msg+'</pre>';
    }
    window.onerror = function(m,s,l,c,e) {
      showError('ERROR: '+m+' @ '+s+':'+l+'\n'+((e&&e.stack)||''));
    };
    window.addEventListener('error', function(ev) {
      if(ev.target !== window) {
        showError('RESOURCE ERROR: '+ev.target.src||ev.target.href||'unknown');
      }
    }, true);
    window.addEventListener('unhandledrejection', function(ev) {
      showError('PROMISE REJECTION: '+String(ev.reason)+'\n'+(ev.reason&&ev.reason.stack||''));
    });
    // Monitor root for changes
    new MutationObserver(function(muts) {
      window.__logs.push('Root mutated: ' + document.getElementById('root').innerHTML.substring(0,100));
    }).observe(document.getElementById('root'), {childList:true, subtree:true});
    console.log('Error handler installed');
    // SW update handling: reload page when new SW takes over
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function(ev) {
        if (ev.data && ev.data.type === 'SW_UPDATED') {
          console.log('SW updated to v' + ev.data.version + ' — reloading for fresh content');
          window.location.reload();
        }
      });
      // Also listen for controllerchange (fires when new SW claims this page)
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        console.log('SW controller changed — reloading');
        window.location.reload();
      });
    }
  </script>
  <script type="module" src="/src/entry-client.tsx"></script>
</body>
</html>
